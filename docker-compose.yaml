services:
  app:
    build:
      context: .
      dockerfile: apps/app-server/Dockerfile
    image: gold-bot-app-server:local
    container_name: gold-bot
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      GB_APP_ENV: production
      GB_APP_SERVER_HOST: 0.0.0.0
      GB_APP_SERVER_PORT: 8880
      GB_NODE_SHADOW_MODE: "false"
      GB_EA_STORE_SQLITE_PATH: /workspace/data/gold_bolt.sqlite
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - ./logs:/workspace/logs
      - ./data:/workspace/data
    restart: unless-stopped
    networks:
      - default
      - 1panel-network

  agents:
    build:
      context: .
      dockerfile: apps/app-agent/Dockerfile
    image: gold-analysis-agent:local
    container_name: gold-analysis-agent
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - GOLDBOT_API_URL=http://app:8880
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - default
      - 1panel-network
    volumes:
      - agent-data:/app/data

  redis:
    image: redis:7-alpine
    container_name: gold-bot-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    container_name: gold-bot-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - default
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: gold-bot-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - default
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  redis-data:
  agent-data:

networks:
  1panel-network:
    external: true
