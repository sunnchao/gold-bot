version: '3.8'

services:
  gold-analysis-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - default
      - 1panel-network
    volumes:
      - agent-data:/app/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  agent-data:

networks:
  1panel-network:
    external: true
