services:
  shadow-app-server:
    build:
      context: .
      dockerfile: apps/app-server/Dockerfile
    image: gold-bot-shadow-app-server:local
    container_name: gold-bot-shadow-app-server
    env_file:
      - .env
    environment:
      GB_APP_ENV: shadow
      GB_APP_SERVER_HOST: 0.0.0.0
      GB_APP_SERVER_PORT: 3000
      GB_NODE_SHADOW_MODE: "true"
      GB_EA_STORE_SQLITE_PATH: /workspace/data/gold_bolt_shadow.sqlite
    ports:
      - "127.0.0.1:3330:3000"
    volumes:
      - ./data:/workspace/data
      - ./logs:/workspace/logs
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    networks:
      - default
      - 1panel-network

networks:
  1panel-network:
    external: true
