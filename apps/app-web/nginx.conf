server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Next.js build assets are immutable - cache them aggressively.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The [accountId] route is statically exported once as "__dynamic__";
    # the client reads the real id from the URL after hydration, so any
    # unmatched /accounts/<id> request must fall back to that shell.
    location /accounts/ {
        try_files $uri $uri/ /accounts/__dynamic__/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
